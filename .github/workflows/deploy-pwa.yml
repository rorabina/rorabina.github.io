name: Build & Deploy Clean PWA

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Last Updated Timestamp & Inject Standard Meta Tags
        run: |
          node -e '
            const fs = require("fs");

            const nowPST = new Date().toLocaleString("en-US", {
              timeZone: "Asia/Manila",
              dateStyle: "medium",
              timeStyle: "medium",
              hour12: true
            }) + " PST";

            const tags = [
              "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">",
              "<meta name=\"theme-color\" content=\"#000000\">"
            ].join("\n");

            const files = fs.readdirSync(".").filter(f => f.endsWith(".html"));
            files.forEach(file => {
              let content = fs.readFileSync(file, "utf8");

              // Replace static "Site Last Updated:" timestamp string
              content = content.replace(/Site Last Updated:\s*<br>\s*[^<]+/gi, "Site Last Updated:<br>" + nowPST);

              fs.writeFileSync(file, content);
              console.log("Updated build timestamp in " + file);
            });
          '

      - name: Commit and Push Processed Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Build site assets and update timestamp [skip ci]" && git push)
