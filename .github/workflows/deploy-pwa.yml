name: Build & Deploy Clean PWA

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update manifest.json for Fullscreen Mode
        run: |
          node -e '
            const fs = require("fs");
            if (fs.existsSync("manifest.json")) {
              const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
              manifest.display = "fullscreen";
              manifest.display_override = ["fullscreen", "standalone"];
              manifest.background_color = "#000000";
              manifest.theme_color = "#000000";
              fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 2));
              console.log("Updated manifest.json display rules.");
            }
          '

      - name: Dynamically Update NUL1 Timestamp & Inject Fullscreen Meta Tags
        run: |
          node -e '
            const fs = require("fs");

            // Format current time in Manila/PST timezone
            const nowPST = new Date().toLocaleString("en-US", {
              timeZone: "Asia/Manila",
              dateStyle: "medium",
              timeStyle: "medium",
              hour12: true
            }) + " PST";

            const tags = [
              "<!-- PWA Immersive Edge-to-Edge Meta Tags -->",
              "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">",
              "<meta name=\"mobile-web-app-capable\" content=\"yes\">",
              "<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">",
              "<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">",
              "<meta name=\"theme-color\" content=\"#000000\">"
            ].join("\n");

            const files = fs.readdirSync(".").filter(f => f.endsWith(".html"));
            files.forEach(file => {
              let content = fs.readFileSync(file, "utf8");

              // 1. Update NUL1 timestamp string dynamically across HTML markup
              content = content.replace(/NUL1\s*-\s*[^<]+/g, "NUL1 - " + nowPST);

              // 2. Inject meta tags if missing
              if (!content.includes("mobile-web-app-capable")) {
                content = content.replace("</head>", "  " + tags + "\n</head>");
              }

              fs.writeFileSync(file, content);
              console.log("Updated NUL1 timestamp and PWA tags in " + file);
            });
          '

      - name: Commit and Push Processed Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NUL1 timestamp to latest edit and fix PWA state [skip ci]" && git push)
